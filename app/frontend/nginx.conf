
# HTTP: Let's Encrypt verification and redirect to HTTPS
server {
    listen 80;
    server_name cloudcart.binsonjoseph.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Serve CloudCart securely
server {
    listen 443 ssl;
    server_name cloudcart.binsonjoseph.xyz;

    ssl_certificate /etc/letsencrypt/live/cloudcart.binsonjoseph.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudcart.binsonjoseph.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=3600" always;

    root /usr/share/nginx/html;
    index index.html;

    # Django Admin static files
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 7d;
    }

    # Django REST API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
